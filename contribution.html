<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Contribution</title>
</head>
<body>
  <h1>Team Contribution</h1>

  <button id="load-contributor">Show Contributor</button>
  <p id="contributor-student-id"></p>

  <p><a href="index.html">Back to Task Manager</a></p>

  <script>
    const btn = document.getElementById('load-contributor');
    const out = document.getElementById('contributor-student-id');

    btn.addEventListener('click', async () => {
      try {
        const res = await fetch('contribution.json', {
          cache: 'no-store'
        });

        if (!res.ok) {
          throw new Error('HTTP ' + res.status);
        }

        const data = await res.json();

        out.textContent =
          'Contributor Student ID: ' + data.contributorStudentId;
      } catch (e) {
        out.textContent = 'Error: ' + e.message;
      }
    });
  </script>
</body>
</html>
